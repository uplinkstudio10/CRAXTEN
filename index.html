<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRAXTEN - Simple</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 800px;
      margin: 0 auto;
    }
    .header {
      padding: 14px 16px;
      background: #111;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-weight: 700;
      color: #00ffaa;
      font-size: 18px;
    }
    .clear-btn {
      background: #222;
      color: #888;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .clear-btn:hover { background: #333; color: #fff; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      display: flex;
      gap: 10px;
      max-width: 85%;
    }
    .message.user { justify-content: flex-end; }
    .message.ai { align-items: flex-start; }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #00ffaa;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
    }
    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .bubble.user {
      background: #007acc;
      color: #fff;
      border-radius: 14px 14px 0 14px;
    }
    .bubble.ai {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 14px 14px 14px 0;
    }
    .input-area {
      padding: 12px 16px;
      background: #111;
      border-top: 1px solid #333;
      display: flex;
      gap: 10px;
    }
    .input {
      flex: 1;
      padding: 10px 14px;
      background: #222;
      border: 1px solid #444;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 15px;
      resize: none;
      max-height: 100px;
      font-family: inherit;
    }
    .input:focus { outline: none; border-color: #00ffaa; }
    .input::placeholder { color: #666; }
    .send-btn {
      padding: 10px 20px;
      background: #00ffaa;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .send-btn:hover { background: #00dd88; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .thinking {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }
    .thinking span {
      width: 6px;
      height: 6px;
      background: #00ffaa;
      border-radius: 50%;
      animation: dot 1.4s ease-in-out infinite;
    }
    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-5px); opacity: 1; }
    }
    @media (max-width: 600px) {
      .message { max-width: 90%; }
      .bubble { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="title">CRAXTEN</div>
      <button class="clear-btn" id="clearBtn">Clear</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <textarea class="input" id="input" placeholder="Ask anything..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const NVIDIA_API_KEY = "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";
    const MODEL = "nvidia/nemotron-3-super-120b-a12b";
    const MAX_TOKENS = 8192;

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');

    let conversation = [];
    let loading = false;

    function addMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = 'message ' + role;

      if (role === 'ai') {
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = 'AI';
        msg.appendChild(avatar);
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + role;
      bubble.textContent = text;
      msg.appendChild(bubble);

      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function callAI() {
      const text = inputEl.value.trim();
      if (!text || loading) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';

      addMessage('user', text);
      conversation.push({ role: 'user', content: text });

      loading = true;
      sendBtn.disabled = true;

      const thinkingMsg = document.createElement('div');
      thinkingMsg.className = 'message ai';
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = 'AI';
      thinkingMsg.appendChild(avatar);
      const thinking = document.createElement('div');
      thinking.className = 'thinking';
      thinking.innerHTML = '<span></span><span></span><span></span>';
      thinkingMsg.appendChild(thinking);
      messagesEl.appendChild(thinkingMsg);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const res = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + NVIDIA_API_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: MODEL,
            messages: conversation,
            temperature: 0.7,
            max_tokens: MAX_TOKENS,
            stream: false
          })
        });

        if (!res.ok) {
          const err = await res.text();
          throw new Error(res.status + ': ' + (err.substring(0, 100) || 'API Error'));
        }

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || 'No response';

        thinkingMsg.remove();
        addMessage('ai', reply);
        conversation.push({ role: 'assistant', content: reply });
      } catch (err) {
        thinkingMsg.remove();
        addMessage('ai', 'Error: ' + err.message);
      } finally {
        loading = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    clearBtn.addEventListener('click', () => {
      if (confirm('Clear chat?')) {
        conversation = [];
        messagesEl.innerHTML = '';
      }
    });

    sendBtn.addEventListener('click', callAI);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        callAI();
      }
    });
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    });

    // Initial message
    addMessage('ai', 'Hello! I am CRAXTEN, your AI assistant.\n\nAsk me anything!');
    inputEl.focus();
  </script>
</body>
</html>
